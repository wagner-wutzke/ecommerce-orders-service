server:
  port: ${APP_PORT:9000}

spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:h2:file:./data/orders-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    show-sql: false
    defer-datasource-initialization: true

  sql.init.mode: always
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      settings:
        web-allow-others: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-events-group.v1}
      properties:
        spring.json.trusted.packages: "net.wowdev.ecommerce.domain.events"

    producer:
      # Strict idempotence. NOTE: Kafka rejects `enable.idempotence=true` together
      # with acks=1 (ConfigException at producer start) — the broker cannot
      # deduplicate without full ISR acknowledgement. acks=all is therefore
      # required; see README "Spec deviations".
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        request.timeout.ms: 10000
        linger.ms: 0

app:
  kafka:
    payments-topic: ${KAFKA_PAYMENTS_TOPIC:payments-topic.v1}
    orders-topic: ${KAFKA_ORDERS_TOPIC:orders-topic.v1}
    customers-topic: ${KAFKA_CUSTOMERS_TOPIC:customers-topic.v1}
    inventory-topic: ${KAFKA_INVENTORY_TOPIC:inventory-topic.v1}

logging:
  level:
    org.hibernate.orm.jdbc.bind: INFO
    org.apache.kafka.common: ERROR
    org.apache.kafka.clients: ERROR
    net.wowdev.ecommerce.orders: ${LOG_LEVEL_ORDERS_SERVICE:DEBUG}
    net.wowdev.ecommerce.customers: ${LOG_LEVEL_CUSTOMERS_SERVICE:DEBUG}
    net.wowdev.ecommerce.inventory: ${LOG_LEVEL_INVENTORY_SERVICE:DEBUG}
    net.wowdev.ecommerce.payments: ${LOG_LEVEL_PAYMENTS_SERVICE:DEBUG}
    net.wowdev.ecommerce.invoices: ${LOG_LEVEL_INVOICES_SERVICE:DEBUG}
    net.wowdev.ecommerce.shipments: ${LOG_LEVEL_SHIPMENTS_SERVICE:DEBUG}
    net.wowdev.ecommerce.datareplication: ${LOG_LEVEL_DATAREPLICATION:INFO}

business:
  config:
    vat-rate: 0.15 # tax rate percent value
    shipping-cost: 12.9 # TODO: to be provided by the shipping service